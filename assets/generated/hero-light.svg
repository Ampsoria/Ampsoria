<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Hi, I&#x27;m Amp — aspiring software developer and cybersecurity enthusiast</title><desc id="desc">Animated orbital illustration and coding terminal. B.Sc. Computer Science student. Code. Connect. Keep learning.</desc>
<defs>
  <linearGradient id="accent"><stop stop-color="#8fffd2"/><stop offset=".55" stop-color="#74dcff"/><stop offset="1" stop-color="#b8a2ff"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#145665" stop-opacity=".5"/><stop offset="1" stop-color="#0b111b" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#91cce2" stroke-opacity=".055"/></pattern>
</defs>
<style>
  .orbit {transform-box:fill-box;transform-origin:center;animation:rotate 38s linear infinite}
  .reverse {animation-direction:reverse;animation-duration:52s}
  .pulse {animation:pulse 4s ease-in-out infinite}
  .float {animation:float 7s ease-in-out infinite}
  .scan {animation:scan 9s ease-in-out infinite}
  .blink {animation:pulse 2s ease-in-out infinite}
  .trace {stroke-dasharray:14 14;animation:trace 18s linear infinite}
  @keyframes rotate {to {transform:rotate(360deg)}}
  @keyframes pulse {0%,100% {opacity:.45} 50% {opacity:1}}
  @keyframes float {0%,100% {transform:translateY(0)} 50% {transform:translateY(-8px)}}
  @keyframes scan {0%,100% {transform:translateX(0);opacity:.15} 50% {transform:translateX(70px);opacity:.65}}
  @keyframes trace {to {stroke-dashoffset:-280}}
  @media (prefers-reduced-motion:reduce) {.orbit,.pulse,.float,.scan,.blink,.trace {animation:none!important}}
</style>
<rect x="1" y="1" width="1198" height="458" rx="24" fill="#f4f9fc" stroke="#d4e2ed"/><rect x="1" y="1" width="1198" height="458" rx="24" fill="url(#grid)"/><ellipse cx="935" cy="215" rx="290" ry="260" fill="url(#aura)"/><text x="48" y="49" fill="#172d43" font-size="15" font-weight="700" font-family="'SFMono-Regular', Consolas, monospace" letter-spacing="4">AMPSORIA</text><text x="1150" y="49" fill="#456078" font-size="12" font-weight="400" font-family="'SFMono-Regular', Consolas, monospace" text-anchor="end" letter-spacing="1.5">SOFTWARE / SYSTEMS / SECURITY</text><path d="M48 73H1152" stroke="#d4e2ed"/><circle cx="55" cy="111" r="4" fill="#157763" class="pulse"/><text x="69" y="115" fill="#157763" font-size="12" font-weight="600" font-family="'SFMono-Regular', Consolas, monospace" letter-spacing="1.8">CURIOUS MIND. HANDS-ON BUILDER.</text><text x="44" y="193" fill="#172d43" font-size="68" font-weight="750" font-family="'Segoe UI', Arial, sans-serif" letter-spacing="-3">Hello, I&#x27;m Amp.</text><text x="47" y="248" fill="#456078" font-size="31" font-weight="500" font-family="'Segoe UI', Arial, sans-serif" letter-spacing="-1">Code. Connect. Keep learning.</text><text x="49" y="285" fill="#456078" font-size="17" font-weight="400" font-family="'Segoe UI', Arial, sans-serif" >Aspiring Software Developer &amp; Cybersecurity Enthusiast</text><rect x="48" y="319" width="586" height="86" rx="12" fill="#0a1420" stroke="#284051"/><circle cx="65" cy="337" r="3" fill="#ff827d"/><circle cx="77" cy="337" r="3" fill="#ffd879"/><circle cx="89" cy="337" r="3" fill="#8fffd2"/><text x="108" y="341" fill="#91aabd" font-size="11" font-weight="400" font-family="'SFMono-Regular', Consolas, monospace" >amp@dev: ~</text><text x="65" y="380" fill="#8fffd2" font-size="17" font-weight="400" font-family="'SFMono-Regular', Consolas, monospace" >&gt; building skills, one project at a time</text><rect x="483" y="366" width="9" height="17" fill="#8fffd2" class="blink"/><g fill="none" stroke="#547185" stroke-opacity=".36"><circle cx="936" cy="250" r="148"/><circle cx="936" cy="250" r="113"/><path d="M759 250h354M936 89v322" stroke-dasharray="3 8"/></g><g class="orbit"><circle cx="936" cy="250" r="148" fill="none" stroke="url(#accent)" stroke-dasharray="76 390" stroke-width="2"/><circle cx="1084" cy="250" r="6" fill="#8fffd2"/><circle cx="788" cy="250" r="4" fill="#b8a2ff"/></g><g class="orbit reverse"><circle cx="936" cy="250" r="113" fill="none" stroke="#74dcff" stroke-opacity=".65" stroke-dasharray="3 16"/><circle cx="936" cy="137" r="5" fill="#74dcff"/><circle cx="936" cy="363" r="5" fill="#74dcff"/></g><g class="float"><rect x="871" y="185" width="130" height="130" rx="32" fill="#101e2b" stroke="#406379"/><text x="936" y="269" fill="#8fffd2" font-size="57" font-weight="700" font-family="'SFMono-Regular', Consolas, monospace" text-anchor="middle">A_</text></g><path class="scan" d="M853 225v49" stroke="#8fffd2" stroke-width="2"/><rect x="777" y="112" width="138" height="30" rx="8" fill="#111f2b" stroke="#355064"/><text x="787" y="131" fill="#c7e5ee" font-size="11" font-weight="400" font-family="'SFMono-Regular', Consolas, monospace" >&lt;/&gt; SOFTWARE</text><rect x="998" y="324" width="138" height="30" rx="8" fill="#111f2b" stroke="#355064"/><text x="1008" y="343" fill="#c7e5ee" font-size="11" font-weight="400" font-family="'SFMono-Regular', Consolas, monospace" >{ } SYSTEMS</text><rect x="761" y="369" width="138" height="30" rx="8" fill="#111f2b" stroke="#355064"/><text x="771" y="388" fill="#c7e5ee" font-size="11" font-weight="400" font-family="'SFMono-Regular', Consolas, monospace" >[*] SECURITY</text><text x="49" y="436" fill="#456078" font-size="10" font-weight="400" font-family="'SFMono-Regular', Consolas, monospace" letter-spacing="2">B.Sc. COMPUTER SCIENCE</text><text x="1150" y="436" fill="#456078" font-size="10" font-weight="400" font-family="'SFMono-Regular', Consolas, monospace" text-anchor="end" letter-spacing="1">ALWAYS A WORK IN PROGRESS  /  ALWAYS MOVING FORWARD</text>
</svg>
