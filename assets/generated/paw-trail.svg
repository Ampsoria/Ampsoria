<svg xmlns="http://www.w3.org/2000/svg" width="560" height="80" viewBox="0 0 560 80" role="img" aria-labelledby="title desc">
<title id="title">Follow the tiny paw prints</title><desc id="desc">A decorative trail of seven softly pulsing pink paw prints.</desc>
<defs>

  <clipPath id="frame"><rect width="560" height="80" rx="24"/></clipPath>
  <linearGradient id="accent"><stop stop-color="#ffacd0"/><stop offset=".55" stop-color="#dbb4ff"/><stop offset="1" stop-color="#b8a2ff"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#d56caa" stop-opacity=".5"/><stop offset="1" stop-color="#251524" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffb2d5" stroke-opacity=".055"/></pattern>
</defs>
<style>
  .petal {animation:petal-fall 15s linear infinite}
  @keyframes petal-fall {0% {transform:translate(-30px,-500px) rotate(0deg);opacity:0} 12%,85% {opacity:1} 100% {transform:translate(80px,500px) rotate(230deg);opacity:0}}
  .orbit {transform-box:fill-box;transform-origin:center;animation:rotate 38s linear infinite}
  .reverse {animation-direction:reverse;animation-duration:52s}
  .pulse {animation:pulse 4s ease-in-out infinite}
  .float {animation:float 7s ease-in-out infinite}
  .scan {animation:scan 9s ease-in-out infinite}
  .blink {animation:pulse 2s ease-in-out infinite}
  .trace {stroke-dasharray:14 14;animation:trace 18s linear infinite}
  @keyframes rotate {to {transform:rotate(360deg)}}
  @keyframes pulse {0%,100% {opacity:.45} 50% {opacity:1}}
  @keyframes float {0%,100% {transform:translateY(0)} 50% {transform:translateY(-8px)}}
  @keyframes scan {0%,100% {transform:translateX(0);opacity:.15} 50% {transform:translateX(70px);opacity:.65}}
  @keyframes trace {to {stroke-dashoffset:-280}}
  @media (prefers-reduced-motion:reduce) {.orbit,.pulse,.float,.scan,.blink,.trace,.petal {animation:none!important}}
</style>
<g transform="translate(30 47) rotate(12)"><g class="pulse" style="animation-delay:-0.0s" fill="#d38cae"><ellipse cy="6" rx="10" ry="8"/><ellipse cx="-12" cy="-6" rx="4" ry="6"/><ellipse cx="-4" cy="-12" rx="4" ry="6"/><ellipse cx="5" cy="-12" rx="4" ry="6"/><ellipse cx="13" cy="-5" rx="4" ry="6"/></g></g><g transform="translate(110 30) rotate(-12)"><g class="pulse" style="animation-delay:-0.5s" fill="#d38cae"><ellipse cy="6" rx="10" ry="8"/><ellipse cx="-12" cy="-6" rx="4" ry="6"/><ellipse cx="-4" cy="-12" rx="4" ry="6"/><ellipse cx="5" cy="-12" rx="4" ry="6"/><ellipse cx="13" cy="-5" rx="4" ry="6"/></g></g><g transform="translate(190 47) rotate(12)"><g class="pulse" style="animation-delay:-1.0s" fill="#d38cae"><ellipse cy="6" rx="10" ry="8"/><ellipse cx="-12" cy="-6" rx="4" ry="6"/><ellipse cx="-4" cy="-12" rx="4" ry="6"/><ellipse cx="5" cy="-12" rx="4" ry="6"/><ellipse cx="13" cy="-5" rx="4" ry="6"/></g></g><g transform="translate(270 30) rotate(-12)"><g class="pulse" style="animation-delay:-1.5s" fill="#d38cae"><ellipse cy="6" rx="10" ry="8"/><ellipse cx="-12" cy="-6" rx="4" ry="6"/><ellipse cx="-4" cy="-12" rx="4" ry="6"/><ellipse cx="5" cy="-12" rx="4" ry="6"/><ellipse cx="13" cy="-5" rx="4" ry="6"/></g></g><g transform="translate(350 47) rotate(12)"><g class="pulse" style="animation-delay:-2.0s" fill="#d38cae"><ellipse cy="6" rx="10" ry="8"/><ellipse cx="-12" cy="-6" rx="4" ry="6"/><ellipse cx="-4" cy="-12" rx="4" ry="6"/><ellipse cx="5" cy="-12" rx="4" ry="6"/><ellipse cx="13" cy="-5" rx="4" ry="6"/></g></g><g transform="translate(430 30) rotate(-12)"><g class="pulse" style="animation-delay:-2.5s" fill="#d38cae"><ellipse cy="6" rx="10" ry="8"/><ellipse cx="-12" cy="-6" rx="4" ry="6"/><ellipse cx="-4" cy="-12" rx="4" ry="6"/><ellipse cx="5" cy="-12" rx="4" ry="6"/><ellipse cx="13" cy="-5" rx="4" ry="6"/></g></g><g transform="translate(510 47) rotate(12)"><g class="pulse" style="animation-delay:-3.0s" fill="#d38cae"><ellipse cy="6" rx="10" ry="8"/><ellipse cx="-12" cy="-6" rx="4" ry="6"/><ellipse cx="-4" cy="-12" rx="4" ry="6"/><ellipse cx="5" cy="-12" rx="4" ry="6"/><ellipse cx="13" cy="-5" rx="4" ry="6"/></g></g>
</svg>
