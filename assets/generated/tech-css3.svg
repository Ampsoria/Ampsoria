<svg xmlns="http://www.w3.org/2000/svg" width="128" height="148" viewBox="0 0 128 148" role="img" aria-labelledby="title desc">
<title id="title">CSS3</title><desc id="desc">CSS3 — Amp&#x27;s languages and tools</desc>
<defs>
  <linearGradient id="accent"><stop stop-color="#8fffd2"/><stop offset=".55" stop-color="#74dcff"/><stop offset="1" stop-color="#b8a2ff"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#145665" stop-opacity=".5"/><stop offset="1" stop-color="#0b111b" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#91cce2" stroke-opacity=".055"/></pattern>
</defs>
<style>
  .orbit {transform-box:fill-box;transform-origin:center;animation:rotate 38s linear infinite}
  .reverse {animation-direction:reverse;animation-duration:52s}
  .pulse {animation:pulse 4s ease-in-out infinite}
  .float {animation:float 7s ease-in-out infinite}
  .scan {animation:scan 9s ease-in-out infinite}
  .blink {animation:pulse 2s ease-in-out infinite}
  .trace {stroke-dasharray:14 14;animation:trace 18s linear infinite}
  @keyframes rotate {to {transform:rotate(360deg)}}
  @keyframes pulse {0%,100% {opacity:.45} 50% {opacity:1}}
  @keyframes float {0%,100% {transform:translateY(0)} 50% {transform:translateY(-8px)}}
  @keyframes scan {0%,100% {transform:translateX(0);opacity:.15} 50% {transform:translateX(70px);opacity:.65}}
  @keyframes trace {to {stroke-dashoffset:-280}}
  @media (prefers-reduced-motion:reduce) {.orbit,.pulse,.float,.scan,.blink,.trace {animation:none!important}}
</style>
<rect x="1" y="1" width="126" height="146" rx="18" fill="#101a27" stroke="#2b3b4e"/><rect x="17" y="17" width="94" height="83" rx="15" fill="#65baff" opacity=".055"/><g transform="translate(37 32) scale(.421875)"><svg width="128" height="128" viewBox="0 0 128 128" fill="#65baff"><path fill="#1572B6" d="M18.814 114.123L8.76 1.352h110.48l-10.064 112.754-45.243 12.543-45.119-12.526z" /><path fill="#33A9DC" d="M64.001 117.062l36.559-10.136 8.601-96.354h-45.16v106.49z" /><path fill="#fff" d="M64.001 51.429h18.302l1.264-14.163H64.001V23.435h34.682l-.332 3.711-3.4 38.114h-30.95V51.429z" /><path fill="#EBEBEB" d="M64.083 87.349l-.061.018-15.403-4.159-.985-11.031H33.752l1.937 21.717 28.331 7.863.063-.018v-14.39z" /><path fill="#fff" d="M81.127 64.675l-1.666 18.522-15.426 4.164v14.39l28.354-7.858.208-2.337 2.406-26.881H81.127z" /><path fill="#EBEBEB" d="M64.048 23.435v13.831H30.64l-.277-3.108-.63-7.012-.331-3.711h34.646zm-.047 27.996v13.831H48.792l-.277-3.108-.631-7.012-.33-3.711h16.447z" /></svg></g><text x="64" y="121" fill="#e6f0fa" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">CSS3</text><path d="M45 136h38" stroke="#65baff" stroke-width="2" stroke-linecap="round" class="pulse" style="animation-delay:-2s"/>
</svg>
