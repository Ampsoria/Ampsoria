<svg xmlns="http://www.w3.org/2000/svg" width="128" height="148" viewBox="0 0 128 148" role="img" aria-labelledby="title desc">
<title id="title">Git</title><desc id="desc">Git — Amp&#x27;s languages and tools</desc>
<defs>
  <linearGradient id="accent"><stop stop-color="#8fffd2"/><stop offset=".55" stop-color="#74dcff"/><stop offset="1" stop-color="#b8a2ff"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#145665" stop-opacity=".5"/><stop offset="1" stop-color="#0b111b" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#91cce2" stroke-opacity=".055"/></pattern>
</defs>
<style>
  .orbit {transform-box:fill-box;transform-origin:center;animation:rotate 38s linear infinite}
  .reverse {animation-direction:reverse;animation-duration:52s}
  .pulse {animation:pulse 4s ease-in-out infinite}
  .float {animation:float 7s ease-in-out infinite}
  .scan {animation:scan 9s ease-in-out infinite}
  .blink {animation:pulse 2s ease-in-out infinite}
  .trace {stroke-dasharray:14 14;animation:trace 18s linear infinite}
  @keyframes rotate {to {transform:rotate(360deg)}}
  @keyframes pulse {0%,100% {opacity:.45} 50% {opacity:1}}
  @keyframes float {0%,100% {transform:translateY(0)} 50% {transform:translateY(-8px)}}
  @keyframes scan {0%,100% {transform:translateX(0);opacity:.15} 50% {transform:translateX(70px);opacity:.65}}
  @keyframes trace {to {stroke-dashoffset:-280}}
  @media (prefers-reduced-motion:reduce) {.orbit,.pulse,.float,.scan,.blink,.trace {animation:none!important}}
</style>
<rect x="1" y="1" width="126" height="146" rx="18" fill="#101a27" stroke="#2b3b4e"/><rect x="17" y="17" width="94" height="83" rx="15" fill="#ff806a" opacity=".055"/><g transform="translate(37 32) scale(.421875)"><svg width="128" height="128" viewBox="0 0 128 128" fill="#ff806a"><path fill="#F34F29" d="M124.737 58.378L69.621 3.264c-3.172-3.174-8.32-3.174-11.497 0L46.68 14.71l14.518 14.518c3.375-1.139 7.243-.375 9.932 2.314 2.703 2.706 3.461 6.607 2.294 9.993l13.992 13.993c3.385-1.167 7.292-.413 9.994 2.295 3.78 3.777 3.78 9.9 0 13.679a9.673 9.673 0 01-13.683 0 9.677 9.677 0 01-2.105-10.521L68.574 47.933l-.002 34.341a9.708 9.708 0 012.559 1.828c3.778 3.777 3.778 9.898 0 13.683-3.779 3.777-9.904 3.777-13.679 0-3.778-3.784-3.778-9.905 0-13.683a9.65 9.65 0 013.167-2.11V47.333a9.581 9.581 0 01-3.167-2.111c-2.862-2.86-3.551-7.06-2.083-10.576L41.056 20.333 3.264 58.123a8.133 8.133 0 000 11.5l55.117 55.114c3.174 3.174 8.32 3.174 11.499 0l54.858-54.858a8.135 8.135 0 00-.001-11.501z" /></svg></g><text x="64" y="121" fill="#e6f0fa" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Git</text><path d="M45 136h38" stroke="#ff806a" stroke-width="2" stroke-linecap="round" class="pulse" style="animation-delay:-3s"/>
