name: Validate profile changes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify data handling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build artwork from the checked-in snapshot
        run: python3 scripts/build_profile.py

      - name: Validate generated SVG documents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          artwork = sorted(Path('assets/generated').glob('*.svg'))
          assert artwork, 'No SVG artwork was generated'
          for path in artwork:
              root = ET.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', path
          print(f'Validated {len(artwork)} SVG documents')
          PY
